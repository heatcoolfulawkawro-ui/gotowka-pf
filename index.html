<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>
// Skróty na ekranie głównym telefonu potrafią pokazywać zbuforowaną,
// starą wersję strony. Ten kod po cichu sprawdza w tle prawdziwą
// aktualną wersję na serwerze (z pominięciem cache przeglądarki) i
// odświeża stronę automatycznie, jeśli wykryje nowszą.
function gotowkaPfFormatVersion(raw){
  var d = new Date(raw);
  if(isNaN(d.getTime())) return raw;
  function pad(n){ return String(n).padStart(2,'0'); }
  return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function gotowkaPfShowVersion(v){
  window.__gotowkaPfVersion = v;
  var el = document.getElementById('pageVersion');
  if(el) el.textContent = 'wersja strony: ' + gotowkaPfFormatVersion(v);
}
(function(){
  var cached = localStorage.getItem('gotowkapf_page_version');
  if(cached) gotowkaPfShowVersion(cached);
  try{
    fetch(location.pathname, { method:'HEAD', cache:'no-store' }).then(function(res){
      var v = res.headers.get('last-modified') || res.headers.get('etag');
      if(!v) return;
      var stored = localStorage.getItem('gotowkapf_page_version');
      localStorage.setItem('gotowkapf_page_version', v);
      gotowkaPfShowVersion(v);
      if(stored && stored !== v) location.replace(location.pathname + '?v=' + Date.now());
    }).catch(function(){});
  }catch(e){}
})();
</script>
<title>Gotówka PF</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --bg:#12181d; --panel:#1b232a; --panel2:#212b33; --line:#2c3841;
    --ink:#e8edf1; --ink-dim:#8fa0ab; --amber:#e8a33d; --green:#4caf7d;
    --red:#d9695f; --blue:#5b9bd5; --radius:12px;
    --font-display:'Manrope',sans-serif; --font-body:'Public Sans',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    padding-inline:14px; padding-block:0 100px;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}

  .topbar{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding-block:14px 8px; margin-inline:-14px; padding-inline:14px;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:2px; flex-wrap:wrap;}
  .brand .name{font-family:var(--font-display); font-weight:800; font-size:1.15rem; letter-spacing:.2px;}
  .brand .sub{color:var(--ink-dim); font-size:.78rem;}
  .sync{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:.68rem; color:var(--ink-dim);}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-dim); flex:0 0 auto;}
  .sync.ok .dot{background:var(--green);}
  .sync.local .dot{background:var(--amber);}
  .sync.err .dot{background:var(--red);}
  .page-version{font-size:.65rem; color:var(--ink-dim); opacity:.7; margin:2px 0 4px; cursor:pointer;}
  .pin-btn{
    margin-left:8px; flex:0 0 auto; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink-dim); border-radius:20px; padding:3px 9px; font-size:.68rem; cursor:pointer;
  }
  .userbtn{font-weight:600; color:var(--ink);}

  .note{
    font-size:.74rem; color:var(--ink-dim); background:var(--panel2); border:1px solid var(--line);
    border-radius:var(--radius); padding:9px 11px; margin:10px 0 12px; line-height:1.4;
  }

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .stack .field{margin-bottom:0;}
  .hero .label{font-size:.7rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em;}
  .hero .big{font-family:var(--font-mono); font-size:2.3rem; font-weight:700; line-height:1.1; margin:4px 0 10px;}
  .track{height:8px; border-radius:99px; background:var(--panel2); overflow:hidden; margin-bottom:8px;}
  .fill{height:100%; background:var(--amber); border-radius:99px 0 0 99px; transition:width .25s;}
  .hero .pct{font-size:.8rem; color:var(--ink-dim); margin-bottom:14px;}
  .hero .pct b{color:var(--ink);}
  .breakdown{display:flex; gap:8px;}
  .breakdown > div{flex:1; background:var(--panel2); border-radius:8px; padding:8px 10px; position:relative;}
  .breakdown .k{font-size:.65rem; color:var(--ink-dim); margin-bottom:2px; display:flex; align-items:center; gap:4px;}
  .breakdown .v{font-family:var(--font-mono); font-size:.86rem; font-weight:700;}
  .v.plus{color:var(--green);} .v.minus{color:var(--red);}
  .editpen{background:none; border:none; color:var(--ink-dim); font-size:.7rem; cursor:pointer; padding:0;}

  .segmented{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; margin-bottom:14px;}
  .segmented button{flex:1; border:none; background:transparent; color:var(--ink-dim); font-family:var(--font-body); font-size:.8rem; font-weight:600; padding:8px 0; border-radius:999px; cursor:pointer;}
  .segmented button.active{background:var(--panel); color:var(--ink); box-shadow:0 0 0 1px var(--line) inset;}
  .segmented button.active.minus{color:var(--red);}
  .segmented button.active.plus{color:var(--green);}

  .trend-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .trend-top .label{font-size:.7rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em;}
  .trend-top .stat{font-family:var(--font-mono); font-size:1.3rem; font-weight:700;}
  .trend-top .stat span{font-family:var(--font-body); font-size:.76rem; font-weight:400; color:var(--ink-dim);}
  .chart{display:flex; align-items:flex-end; gap:6px; height:100px; padding-top:18px; overflow-x:auto;}
  .bar-wrap{flex:1; min-width:26px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-amt{font-family:var(--font-mono); font-size:.6rem; color:var(--ink-dim); margin-bottom:4px; white-space:nowrap;}
  .bar{width:100%; max-width:26px; background:var(--amber); border-radius:4px 4px 0 0; min-height:2px;}
  .bar-date{font-size:.62rem; color:var(--ink-dim); margin-top:6px; white-space:nowrap;}
  .chart-empty{font-size:.8rem; color:var(--ink-dim); padding:20px 4px; text-align:center;}

  .section-label{font-size:.7rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin:16px 2px 8px;}
  .entry{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .entry:last-child{border-bottom:none;}
  .entry .sign{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}
  .entry .sign.minus{background:rgba(217,105,95,.15); color:var(--red);}
  .entry .sign.plus{background:rgba(76,175,125,.15); color:var(--green);}
  .entry .mid{flex:1; min-width:0;}
  .entry .date{font-size:.82rem; font-weight:600;}
  .who-tag{font-size:.62rem; font-weight:700; color:var(--ink-dim); background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:1px 6px; vertical-align:middle;}
  .entry .note-txt{font-size:.74rem; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .amt{font-family:var(--font-mono); font-weight:700; font-size:.86rem; flex:none;}
  .amt.minus{color:var(--red);} .amt.plus{color:var(--green);}
  .empty-list{font-size:.82rem; color:var(--ink-dim); text-align:center; padding:22px 4px;}

  .fab{
    position:fixed; right:16px; bottom:24px; z-index:8;
    background:var(--amber); color:#20160a; border:none; border-radius:999px;
    padding:14px 20px; font-size:.92rem; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  @media (min-width:640px){ .fab{ right:calc(50% - 260px + 16px); } body{max-width:520px; margin-inline:auto;} }

  .pagehead{display:flex; align-items:center; gap:10px; padding-block:14px 10px; position:sticky; top:0; background:var(--bg); z-index:9;}
  .backbtn{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:.85rem; cursor:pointer;}
  .pagehead h2{font-size:1.05rem;}

  .field{display:block; margin-bottom:14px;}
  .field label{font-size:.72rem; color:var(--ink-dim); margin-bottom:6px; display:block;}
  .field input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:12px; font-size:16px; font-family:inherit;}
  .field input:focus{outline:2px solid var(--amber); outline-offset:-1px;}
  .field-error{font-size:.72rem; color:var(--red); margin-top:-8px; margin-bottom:12px; display:none;}
  .field-error.show{display:block;}

  .preview{background:var(--panel2); border:1px dashed var(--line); border-radius:8px; padding:10px 12px; font-size:.8rem; color:var(--ink-dim); margin-bottom:16px;}
  .preview b{color:var(--ink); font-family:var(--font-mono);}
  .savebtn{width:100%; background:var(--amber); color:#20160a; border:none; border-radius:10px; padding:14px; font-size:.92rem; font-weight:800; cursor:pointer;}
  .delbtn{width:100%; background:transparent; border:none; color:var(--red); padding:14px; font-size:.82rem; cursor:pointer; margin-top:6px;}

  .overlay{position:fixed; inset:0; background:rgba(8,11,14,.72); z-index:30; display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--panel); border:1px solid var(--line); border-radius:16px 16px 0 0; width:100%; max-width:480px; padding:18px 16px 22px; max-height:88vh; overflow-y:auto;}
  .sheet-actions{display:flex; gap:8px; margin-top:14px;}
  .sheet-actions button{flex:1; border:none; border-radius:8px; padding:12px; font-size:.85rem; font-weight:700; cursor:pointer;}
  .btn-cancel{background:var(--panel2); color:var(--ink-dim); border:1px solid var(--line) !important;}
  .btn-save{background:var(--amber); color:#1b1204;}

  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--panel2); border:1px solid var(--line); color:var(--ink); padding:10px 16px; border-radius:10px; font-size:.82rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:40; display:flex; align-items:center; gap:8px; max-width:88vw;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .tdot{width:7px;height:7px;border-radius:50%;background:var(--green); flex:0 0 auto;}
  .toast.err .tdot{background:var(--red);}

  .msg{border-radius:8px; padding:10px 12px; font-size:.8rem;}
  .msg.ok{background:rgba(76,175,125,.12); color:var(--green); border:1px solid rgba(76,175,125,.3);}
  .msg.err{background:rgba(217,105,95,.12); color:var(--red); border:1px solid rgba(217,105,95,.3);}
  .msg.warn{background:rgba(232,163,61,.12); color:var(--amber); border:1px solid rgba(232,163,61,.3);}
  .chip{font-size:.66rem; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--panel2); color:var(--ink-dim); border:1px solid var(--line); white-space:nowrap;}
  .chip.ok{color:var(--green); border-color:rgba(76,175,125,.3);}
  .chip.err{color:var(--red); border-color:rgba(217,105,95,.3);}
  .chip.warn{color:var(--amber); border-color:rgba(232,163,61,.3);}
  .busy{display:flex; align-items:center; gap:10px;}
  .spin{width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .menu{position:fixed; top:54px; right:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; z-index:20; display:flex; flex-direction:column; min-width:170px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .menu button{background:none; border:none; color:var(--ink); text-align:left; padding:10px 12px; font-size:.85rem; border-radius:6px; cursor:pointer; font-family:inherit;}
  .menu button:active{background:var(--panel2);}

  [hidden]{display:none!important;}
</style>
</head>
<body>

<script>
/* ====================== KONFIGURACJA ====================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxa7mnwnG-iuFvYKqx4-callLWoLGwXzEHk4p3WnU9TdJ7_agcLWNYafWN6KQmIe__g/exec';
const STORAGE_KEY = 'gotowkaPfState';
const LS_AUTH = 'gotowkaPfAuth_v1';
const configured = () => GAS_URL.indexOf('__DEPLOYMENT_ID__') < 0;

/* ====================== POMOCNICZE ====================== */
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const esc = escHtml;
function msgHtml(kind, text) { return `<div class="msg ${kind}">${text}</div>`; }

/* ====================== KONTA / SESJA ====================== */
let auth = lsGet(LS_AUTH, null); // {token, user, expires}

async function api(action, payload) {
  if (!configured()) throw new Error('offline');
  const body = Object.assign({ action }, payload || {});
  if (auth && auth.token && !body.token) body.token = auth.token;
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const text = await res.text();
  let out;
  try { out = JSON.parse(text); } catch (e) { throw new Error('offline'); }
  if (out && out.error === 'auth' && auth && action !== 'login') { logoutLocal(); showAuth('Sesja wygasła — zaloguj się ponownie.'); }
  return out;
}

function logoutLocal() { auth = null; lsDel(LS_AUTH); renderUserBtn(); }
function setAuth(out) { auth = { token: out.token, user: out.user, expires: out.expires }; lsSet(LS_AUTH, auth); renderUserBtn(); }

function renderUserBtn() {
  const b = document.getElementById('userBtn');
  b.hidden = !auth;
  if (auth) b.textContent = auth.user.name + ' ▾';
  document.getElementById('menuAdmin').hidden = !(auth && auth.user.role === 'admin');
  const hub = document.getElementById('btnHub');
  hub.hidden = !auth;
  hub.onclick = () => { location.href = auth && auth.user.id === 'PF' ? 'https://heatcoolfulawkawro-ui.github.io/' : 'https://heatcoolfulawkawro-ui.github.io/zuzia/'; };
}

function showScreen(id) {
  ['scrAuth', 'scrSetPin', 'appShell', 'scrChangePin', 'scrAdmin'].forEach(s => document.getElementById(s).hidden = s !== id);
  document.getElementById('menu').hidden = true;
  window.scrollTo(0, 0);
}

async function showAuth(note) {
  showScreen('scrAuth');
  const el = document.getElementById('scrAuth');
  if (!configured()) {
    el.innerHTML = `<div class="card stack"><h2>Gotówka PF</h2>${msgHtml('warn', 'Appka nie jest jeszcze podłączona do Arkusza.')}</div>`;
    return;
  }
  el.innerHTML = `<div class="card stack"><div class="busy"><div class="spin"></div><span style="color:var(--ink-dim)">Łączę z Arkuszem…</span></div></div>`;
  let st = null;
  try { st = await api('status'); } catch (e) {}
  if (st && st.ok && st.setup) return showBootstrap();
  el.innerHTML = `<form class="card stack" id="loginForm" autocomplete="on">
    <h2>Zaloguj się</h2>
    ${note ? msgHtml('warn', esc(note)) : ''}
    ${!st ? msgHtml('err', 'Brak połączenia z Arkuszem. Sprawdź internet.') : ''}
    <label class="field"><label>Login (skrót, np. PF)</label><input id="lgUser" autocapitalize="characters" autocomplete="username" maxlength="6"></label>
    <label class="field"><label>PIN</label><input id="lgPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="current-password"></label>
    <div id="lgMsg"></div>
    <button class="savebtn" type="submit" id="lgBtn">Zaloguj</button>
    <button type="button" id="lgForgot" style="background:none;border:none;color:var(--ink-dim);font-size:.78rem;padding:10px;width:100%;cursor:pointer;">Nie pamiętam PIN-u / pierwsze logowanie</button>
  </form>`;
  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const user = document.getElementById('lgUser').value.trim().toUpperCase(), pin = document.getElementById('lgPin').value.trim();
    const box = document.getElementById('lgMsg');
    if (!/^[A-Z]{1,6}$/.test(user) || !/^\d{4,10}$/.test(pin)) { box.innerHTML = msgHtml('err', 'Login to 1–6 liter, PIN to 4-10 cyfr.'); return; }
    box.innerHTML = '';
    const btn = document.getElementById('lgBtn');
    if (btn.disabled) return; // już trwa logowanie — ignoruj drugie kliknięcie
    btn.disabled = true;
    const origText = btn.textContent;

async function adminClick(e, users) {
  const t = e.target.closest('[data-ad]');
  if (!t) return;
  const a = t.dataset.ad, id = t.dataset.id;
  const done = (out, okText) => {
    if (out && out.ok) {
      const warn = out.sent === false ? msgHtml('err', 'Konto zapisane, ale mail się nie wysłał (limit Google albo zły adres). Spróbuj „Wyślij" później.') : msgHtml('ok', okText);
      if (out.users) renderAdmin(out.users, warn); else showAdmin(warn);
    } else {
      const why = { exists: 'taki login już jest', bad: 'sprawdź dane' }[out && out.error] || 'brak połączenia';
      document.getElementById('scrAdmin').insertAdjacentHTML('afterbegin', msgHtml('err', 'Nie udało się: ' + why + '.'));
      window.scrollTo(0, 0);
    }
  };
  try {
    if (a === 'sendLink') done(await api('admin.sendLink', { id }), 'Wysłano link na e-mail.');
    else if (a === 'unlock') done(await api('admin.unlock', { id }), 'Odblokowano.');
    else if (a === 'active') done(await api('admin.setActive', { id, active: t.dataset.v === '1' }), t.dataset.v === '1' ? 'Konto włączone.' : 'Konto wyłączone (dane zostają).');
    else if (a === 'email') { const b = document.getElementById('scrAdmin').querySelector(`[data-emailbox="${id}"]`); b.hidden = !b.hidden; }
    else if (a === 'saveEmail') { const v = document.getElementById('scrAdmin').querySelector(`[data-emailbox="${id}"] input`).value.trim(); done(await api('admin.setEmail', { id, email: v }), 'E-mail zmieniony.'); }
    else if (a === 'create') {
      const nid = document.getElementById('nuId').value.trim().toUpperCase(), name = document.getElementById('nuName').value.trim(), email = document.getElementById('nuEmail').value.trim();
      if (!/^[A-Z]{1,6}$/.test(nid) || !name || !/@/.test(email)) { document.getElementById('scrAdmin').insertAdjacentHTML('afterbegin', msgHtml('err', 'Uzupełnij login (1–6 liter), imię i e-mail.')); window.scrollTo(0, 0); return; }
      done(await api('admin.createUser', { id: nid, name, email }), `Dodano ${esc(name)}. Zaproszenie z linkiem do ustawienia PIN-u poszło na ${esc(email)}.`);
    }
  } catch (err) { document.getElementById('scrAdmin').insertAdjacentHTML('afterbegin', msgHtml('err', 'Brak połączenia z Arkuszem.')); window.scrollTo(0, 0); }
}

/* ====================== STAN / DANE (pula i wpisy — wspólne dla PF i ZF) ====================== */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }

function seedState(){
  return { poolStart: 4650, entries: [] };
}

let state = loadState();

function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return Object.assign(seedState(), JSON.parse(raw)); }catch(e){}
  return seedState();
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  setSyncStatus('local');
  syncRemote();
}

function setSyncStatus(kind){
  const el = document.getElementById('syncIndicator');
  const txt = document.getElementById('syncText');
  el.className = 'sync ' + kind;
  txt.textContent = kind==='ok' ? 'zsynchronizowano' : kind==='err' ? 'błąd synchronizacji' : 'zapisano lokalnie';
}

async function syncRemote(){
  if(!configured() || !auth) return;
  try{
    const out = await api('set', { key: STORAGE_KEY, value: JSON.stringify(state) });
    setSyncStatus(out && out.ok ? 'ok' : 'err');
  }catch(e){ setSyncStatus('err'); }
}

// Telefon wraca do zasięgu — appka sama dogania zaległy zapis.
window.addEventListener('online', syncRemote);

async function loadRemoteOnStart(){
  if(!configured() || !auth) return;
  try{
    const out = await api('get', { key: STORAGE_KEY });
    if(!out || !out.ok){ setSyncStatus('local'); return; }
    // Sam dotarliśmy do serwera z ważną sesją — to już sukces, nawet gdy
    // odpowiedź jest pusta (pierwszy raz, jeszcze bez zapisanych danych).
    setSyncStatus('ok');
    applyRemoteState(out.value);
  }catch(e){ setSyncStatus('local'); /* offline — zostajemy przy danych lokalnych */ }
}

function applyRemoteState(text){
  if(!text) return;
  try{
    const remote = JSON.parse(text);
    if(remote && typeof remote.poolStart === 'number' && Array.isArray(remote.entries)){
      state = remote;
      render();
    }
  }catch(e){ /* nieprawidłowa odpowiedź — zostajemy przy danych lokalnych */ }
}

/* ====================== POMOCNICZE / DATY ====================== */
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dm(iso){ const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function daysBetween(iso1, iso2){
  const [y1,m1,d1] = iso1.split('-').map(Number);
  const [y2,m2,d2] = iso2.split('-').map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 86400000);
}
function addDaysIso(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+n);
  return dt.toISOString().slice(0,10);
}
function isoWeekStart(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  const dow = (dt.getUTCDay()+6)%7; // 0 = poniedziałek
  dt.setUTCDate(dt.getUTCDate()-dow);
  return dt.toISOString().slice(0,10);
}
function monthKey(iso){ return iso.slice(0,7); }
function addMonthsKey(mk, n){
  const [y,m] = mk.split('-').map(Number);
  const total = y*12 + (m-1) + n;
  return Math.floor(total/12) + '-' + pad(total%12+1);
}
function fmtDateShort(iso){ const [,m,d]=iso.split('-'); return `${d}.${m}`; }
const MONTHS_SHORT = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function zl(v){ return Math.round(v).toLocaleString('pl-PL') + ' zł'; }

/* ====================== LICZENIE ====================== */
// Dopłata zamyka bieżący okres (ile było / ile wykorzystano trafia do
// "Zamkniętych okresów") i otwiera nowy, którego pula startowa = to, co
// zostało z poprzedniego + kwota dopłaty. `poolOverride` na wpisie dopłaty
// (ustawiane przez ✎ na "Pula startowa", gdy okres już trwa) pozwala ręcznie
// skorygować tę wyliczoną wartość, tak jak state.poolStart robi to dla
// pierwszego okresu (przed jakąkolwiek dopłatą).
function computePeriods(entries){
  const sorted = (entries || state.entries).slice().sort((a,b)=> a.date===b.date ? (a.createdAt-b.createdAt) : (a.date<b.date?-1:1));
  const closed = [];
  let start = state.poolStart, used = 0;
  sorted.forEach(e=>{
    if(e.type==='minus'){ used += e.amount; return; }
    const leftover = start - used;
    closed.push({ start, used, leftover, doplata: e.amount, closedDate: e.date });
    start = e.poolOverride!=null ? e.poolOverride : leftover + e.amount;
    used = 0;
  });
  return { closed, current: { start, used, leftover: start - used } };
}

function lastDoplataEntry(){
  const doplaty = state.entries.filter(e=>e.type==='plus')
    .sort((a,b)=> a.date===b.date ? (a.createdAt-b.createdAt) : (a.date<b.date?-1:1));
  return doplaty.length ? doplaty[doplaty.length-1] : null;
}

function computeStats(){
  const { current } = computePeriods();
  const pct = current.start>0 ? Math.round(current.used/current.start*100) : 0;
  return { wydano: current.used, pula: current.start, zostalo: current.leftover, pct };
}

function minusEntries(exceptId){
  return state.entries.filter(e=>e.type==='minus' && e.id!==exceptId);
}

function avgDaysBetween(){
  const dates = minusEntries().map(e=>e.date).sort();
  if(dates.length<2) return null;
  let sum=0;
  for(let i=1;i<dates.length;i++) sum += daysBetween(dates[i-1], dates[i]);
  return Math.round(sum/(dates.length-1)*10)/10;
}

let chartMode = 'day';

function chartData(){
  const list = minusEntries();
  if(chartMode==='day'){
    return list.slice().sort((a,b)=> a.date<b.date?-1:1).slice(-10)
      .map(e=>({label: fmtDateShort(e.date), value: e.amount}));
  }
  if(chartMode==='week'){
    const curStart = isoWeekStart(todayISO());
    const weeks = []; for(let i=7;i>=0;i--) weeks.push(addDaysIso(curStart, -7*i));
    const sums = {}; weeks.forEach(w=>sums[w]=0);
    list.forEach(e=>{ const wk=isoWeekStart(e.date); if(wk in sums) sums[wk]+=e.amount; });
    return weeks.map(w=>({label: fmtDateShort(w), value: sums[w]}));
  }
  // month
  const curMonth = monthKey(todayISO());
  const months = []; for(let i=5;i>=0;i--) months.push(addMonthsKey(curMonth, -i));
  const sums = {}; months.forEach(m=>sums[m]=0);
  list.forEach(e=>{ const mk=monthKey(e.date); if(mk in sums) sums[mk]+=e.amount; });
  return months.map(m=>({label: MONTHS_SHORT[+m.split('-')[1]-1], value: sums[m]}));
}

/* ====================== RENDER ====================== */
function render(){
  const s = computeStats();
  document.getElementById('stZostalo').textContent = zl(s.zostalo);
  document.getElementById('stFill').style.width = Math.min(100, Math.max(0,s.pct)) + '%';
  document.getElementById('stPct').textContent = s.pct + '%';
  document.getElementById('stPula').textContent = zl(s.pula);
  document.getElementById('stStart').textContent = zl(s.pula);
  document.getElementById('stWydano').textContent = '−' + zl(s.wydano);

  const avg = avgDaysBetween();
  document.getElementById('stAvg').innerHTML = (avg==null ? '—' : ('~' + avg + ' dni')) + ' <span>średnio</span>';

  renderChart();
  renderList();
  renderPeriods();
}

function renderPeriods(){
  const { closed } = computePeriods();
  const label = document.getElementById('periodsLabel');
  const list = document.getElementById('periodsList');
  if(!closed.length){ label.hidden = true; list.hidden = true; return; }
  label.hidden = false; list.hidden = false;
  list.innerHTML = closed.slice().reverse().map(p => `
    <div class="entry" style="cursor:default">
      <div class="mid">
        <div class="date">Do ${dm(p.closedDate)}</div>
        <div class="note-txt">Było ${zl(p.start)} · wykorzystano ${zl(p.used)} · zostało ${zl(p.leftover)}</div>
      </div>
      <div class="amt plus">+${zl(p.doplata)}</div>
    </div>`).join('');
}

function renderChart(){
  const data = chartData();
  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  if(!data.some(d=>d.value>0)){
    chart.className = 'chart-empty';
    chart.textContent = 'Brak pobrań w tym zakresie.';
    return;
  }
  chart.className = 'chart';
  const max = data.reduce((m,d)=>Math.max(m,d.value),1);
  data.forEach(d=>{
    const wrap = document.createElement('div'); wrap.className='bar-wrap';
    const amt = document.createElement('div'); amt.className='bar-amt'; amt.textContent = d.value ? Math.round(d.value) : '';
    const bar = document.createElement('div'); bar.className='bar';
    bar.style.height = Math.max(2, Math.round(d.value/max*100)) + '%';
    const lbl = document.createElement('div'); lbl.className='bar-date'; lbl.textContent = d.label;
    wrap.appendChild(amt); wrap.appendChild(bar); wrap.appendChild(lbl);
    chart.appendChild(wrap);
  });
}

function renderList(){
  const list = document.getElementById('entryList');
  const sorted = state.entries.slice().sort((a,b)=> a.date===b.date ? (b.createdAt-a.createdAt) : (a.date<b.date?1:-1));
  if(!sorted.length){ list.innerHTML = '<div class="empty-list">Brak wpisów — dodaj pierwszy przyciskiem „＋ Nowy wpis”.</div>'; return; }
  list.innerHTML = sorted.map(e => `
    <div class="entry" data-id="${e.id}">
      <div class="sign ${e.type}">${e.type==='minus'?'−':'+'}</div>
      <div class="mid"><div class="date">${dm(e.date)}${e.who ? ` <span class="who-tag">${escHtml(e.who)}</span>` : ''}</div>${e.note ? `<div class="note-txt">${escHtml(e.note)}</div>` : ''}</div>
      <div class="amt ${e.type}">${e.type==='minus'?'−':'+'}${zl(e.amount)}</div>
    </div>`).join('');
}

/* ====================== DODAWANIE / EDYCJA WPISU ====================== */
let editingId = null;

function openAdd(){
  editingId = null;
  document.getElementById('addTitle').textContent = 'Nowy wpis';
  document.getElementById('btnDelete').hidden = true;
  setSeg('segMinus');
  setWho(lastWho());
  document.getElementById('fKwota').value = '';
  document.getElementById('fData').value = todayISO();
  document.getElementById('fNotatka').value = '';
  document.getElementById('errKwota').classList.remove('show');
  showAddView();
}
function openEdit(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  document.getElementById('addTitle').textContent = 'Edytuj wpis';
  document.getElementById('btnDelete').hidden = false;
  document.getElementById('btnDelete').textContent = 'Usuń wpis';
  setSeg(e.type==='minus' ? 'segMinus' : 'segPlus');
  setWho(e.who || 'PF');
  document.getElementById('fKwota').value = e.amount;
  document.getElementById('fData').value = e.date;
  document.getElementById('fNotatka').value = e.note || '';
  document.getElementById('errKwota').classList.remove('show');
  showAddView();
}
function showAddView(){
  document.getElementById('viewMain').hidden = true;
  document.getElementById('btnAdd').hidden = true;
  document.getElementById('viewAdd').hidden = false;
  updatePreview();
  window.scrollTo(0,0);
}
function closeAddView(){
  document.getElementById('viewAdd').hidden = true;
  document.getElementById('viewMain').hidden = false;
  document.getElementById('btnAdd').hidden = false;
  window.scrollTo(0,0);
}
function setSeg(id){
  document.getElementById('segMinus').classList.toggle('active', id==='segMinus');
  document.getElementById('segPlus').classList.toggle('active', id==='segPlus');
  updatePreview();
}
function currentType(){ return document.getElementById('segMinus').classList.contains('active') ? 'minus' : 'plus'; }

function setWho(who){
  [...document.getElementById('whoSeg').children].forEach(b => b.classList.toggle('active', b.dataset.who===who));
}
function currentWho(){
  const btn = document.getElementById('whoSeg').querySelector('.active');
  return btn ? btn.dataset.who : 'PF';
}
// Domyślny wybór dla nowego wpisu: kto jest zalogowany (jeśli to PF albo ZF),
// inaczej ostatni ręczny wybór na tym urządzeniu — zawsze można zmienić ręcznie.
function lastWho(){
  if (auth && auth.user && (auth.user.id === 'PF' || auth.user.id === 'ZF')) return auth.user.id;
  try{ return localStorage.getItem('gotowkaPfLastWho') || 'PF'; }catch(e){ return 'PF'; }
}
document.getElementById('whoSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-who]');
  if(!btn) return;
  setWho(btn.dataset.who);
});

function updatePreview(){
  const kwota = parseFloat((document.getElementById('fKwota').value||'').replace(',','.')) || 0;
  const type = currentType();
  const date = document.getElementById('fData').value || todayISO();
  // Symulacja: podmień edytowany wpis (jeśli edycja) albo dopisz nowy, i policz
  // okresy tak samo jak dla prawdziwych danych — dzięki temu podgląd poprawnie
  // pokazuje, że Dopłata zamyka bieżący okres i otwiera nowy od reszty+dopłaty.
  const temp = state.entries.filter(e=>e.id!==editingId);
  temp.push({ date, type, amount: kwota, createdAt: Date.now() });
  const { current } = computePeriods(temp);
  const pct = current.start>0 ? Math.round(current.used/current.start*100) : 0;
  document.getElementById('fPreview').innerHTML = `Po zapisaniu zostanie: <b>${zl(current.leftover)}</b> · wykorzystano <b>${pct}%</b>`;
}

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnBack').addEventListener('click', closeAddView);
document.getElementById('segMinus').addEventListener('click', ()=>setSeg('segMinus'));
document.getElementById('segPlus').addEventListener('click', ()=>setSeg('segPlus'));
document.getElementById('fKwota').addEventListener('input', updatePreview);
document.getElementById('entryList').addEventListener('click', e=>{
  const row = e.target.closest('.entry');
  if(row) openEdit(row.dataset.id);
});

document.getElementById('btnSave').addEventListener('click', ()=>{
  const kwota = parseFloat((document.getElementById('fKwota').value||'').replace(',','.')) || 0;
  if(!(kwota>0)){ document.getElementById('errKwota').classList.add('show'); return; }
  document.getElementById('errKwota').classList.remove('show');
  const date = document.getElementById('fData').value || todayISO();
  const note = document.getElementById('fNotatka').value.trim();
  const type = currentType();
  const who = currentWho();
  try{ localStorage.setItem('gotowkaPfLastWho', who); }catch(e){}
  if(editingId){
    const e = state.entries.find(x=>x.id===editingId);
    if(e){ e.amount=kwota; e.date=date; e.note=note; e.type=type; e.who=who; }
  }else{
    state.entries.push({ id: uid(), date, type, amount: kwota, note, who, createdAt: Date.now() });
  }
  closeAddView();
  render();
  saveState();
});

document.getElementById('btnDelete').addEventListener('click', function(){
  if(this.dataset.sure !== '1'){ this.dataset.sure='1'; this.textContent='Na pewno usunąć?'; return; }
  state.entries = state.entries.filter(x=>x.id!==editingId);
  this.dataset.sure=''; this.textContent='Usuń wpis';
  closeAddView();
  render();
  saveState();
});

document.getElementById('chartSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  chartMode = btn.dataset.mode;
  [...document.getElementById('chartSeg').children].forEach(b=>b.classList.toggle('active', b===btn));
  renderChart();
});

/* ====================== PULA STARTOWA ====================== */
function openPoolEdit(){
  document.getElementById('poolNewVal').value = computePeriods().current.start;
  document.getElementById('poolEditOverlay').classList.add('open');
}
function closePoolEdit(){ document.getElementById('poolEditOverlay').classList.remove('open'); }
function savePoolEdit(){
  const v = parseFloat((document.getElementById('poolNewVal').value||'').replace(',','.'));
  if(!(v>=0)){ showToast('Podaj poprawną kwotę', true); return; }
  // Przed pierwszą dopłatą "pula startowa" to state.poolStart wprost; po
  // dopłacie bieżący okres ma pulę WYLICZONĄ (reszta + dopłata) — ręczna
  // korekta zapisuje się jako poolOverride na tej dopłacie, patrz computePeriods().
  const last = lastDoplataEntry();
  if(last){ last.poolOverride = v; } else { state.poolStart = v; }
  closePoolEdit();
  render();
  saveState();
  showToast('Pula startowa zaktualizowana');
}

/* ====================== TOAST ====================== */
let toastTimer;
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ====================== START ====================== */
(function start() {
  const link = new URLSearchParams(location.search).get('pin');
  if (link) return showSetPin(link);
  if (auth && auth.token && (!auth.expires || auth.expires > Date.now())) return startMain();
  showAuth();
})();
</script>
